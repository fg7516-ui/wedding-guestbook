<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>웨딩 미니룸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  /* 레이아웃: 화면 전체가 밤의 야외 결혼식장(캔버스). 제목은 위에, 버튼은 아래에 겹쳐 놓는다. */
  :root{
    --night:#1d1530;
    --plum:#6b4a7a;
    --gold:#e8b86d;
    --rose:#e8919c;
    --cream:#f6efe3;
    --ink:#1c1424;
    --panel:rgba(28,20,36,.82);
    --line:rgba(246,239,227,.2);
    --groom:#4f86ea;
    --bride:#ee7fa2;
    --font-title:"Jua", "Gowun Dodum", sans-serif;
    --font-body:"Gowun Dodum", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    --font-pixel:"Press Start 2P", monospace;
    color-scheme: dark;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{margin:0; padding:0; height:100%; overflow:hidden; background:var(--night);}
  body{font-family:var(--font-body); color:var(--cream); position:relative;}

  #scene{position:absolute; inset:0; overflow:hidden; background:var(--night);}
  #world{position:absolute; inset:0; width:100%; height:100%; display:block; image-rendering:pixelated; touch-action:none;}
  #bubbles{position:absolute; inset:0; pointer-events:none; z-index:6;}

  /* 상단 제목 */
  .uiTop{
    position:absolute; top:0; left:0; right:0; z-index:8; pointer-events:none;
    background:linear-gradient(rgba(14,10,24,.62) 0%, rgba(14,10,24,.38) 70%, rgba(14,10,24,0) 100%);
    padding:16px max(16px, env(safe-area-inset-right, 0px)) 22px max(16px, env(safe-area-inset-left, 0px));
    text-align:center;
  }
  #couple{
    font-family:var(--font-pixel); font-size:15px; line-height:1.8; color:var(--cream);
    text-shadow:0 0 12px rgba(232,184,109,.6), 2px 2px 0 rgba(0,0,0,.45);
  }
  #couple .heart{color:var(--rose);}
  #subtitle{margin-top:6px; font-family:var(--font-title); font-size:15px; color:var(--gold); text-shadow:0 1px 0 rgba(0,0,0,.5);}
  .metaRow{display:flex; justify-content:center; align-items:center; gap:6px; flex-wrap:wrap; margin-top:8px;}
  #guestCount{
    display:inline-block; padding:5px 12px; border-radius:999px;
    background:var(--panel); font-size:12px; color:var(--cream); border:1px solid var(--line);
  }
  .roomNav{
    display:inline-flex; gap:2px; padding:3px; border-radius:999px; pointer-events:auto;
    background:var(--panel); border:1px solid var(--line);
  }
  .roomNav button{
    font-family:var(--font-title); font-size:13px; line-height:1.2; color:var(--cream); background:transparent;
    border:none; border-radius:999px; padding:5px 10px; cursor:pointer; white-space:nowrap;
  }
  .roomNav button b{font-weight:400; color:var(--gold); margin-left:4px; font-variant-numeric:tabular-nums;}
  .roomNav button.on{background:var(--gold); color:var(--ink);}
  .roomNav button.on b{color:var(--ink);}
  .edgeBtn{
    position:absolute; top:48%; z-index:9; display:flex; align-items:center; gap:4px;
    padding:10px 10px; font-family:var(--font-title); font-size:13px; color:var(--cream);
    background:var(--panel); border:1px solid var(--line); cursor:pointer;
  }
  .edgeBtn i{font-style:normal; font-size:18px; line-height:1; color:var(--gold);}
  #goLeft{left:0; border-left:none; border-radius:0 999px 999px 0; padding-left:calc(8px + env(safe-area-inset-left, 0px));}
  #goRight{right:0; border-right:none; border-radius:999px 0 0 999px; padding-right:calc(8px + env(safe-area-inset-right, 0px));}
  .notice{
    position:absolute; left:0; right:0; bottom:84px; z-index:9; margin:0 auto; width:fit-content; max-width:calc(100% - 32px);
    background:#7a2d2d; color:#fff; font-size:12px; line-height:1.4; padding:6px 12px; border-radius:8px; text-align:center; display:none;
  }
  #emptyState{
    position:absolute; left:50%; top:62%; transform:translate(-50%,-50%); z-index:7; width:78%; max-width:300px;
    text-align:center; font-size:14px; line-height:1.6; padding:10px 14px; border-radius:12px;
    background:var(--panel); border:1px solid var(--line); pointer-events:none;
  }

  /* 말풍선 */
  .bubble{
    position:absolute; left:0; top:0; max-width:170px; width:max-content;
    background:#fff; color:var(--ink); border:2px solid var(--ink); border-radius:4px;
    padding:6px 10px; font-family:var(--font-title); font-size:13px; line-height:1.4; text-align:center;
    box-shadow:2px 2px 0 rgba(0,0,0,.35); overflow-wrap:anywhere;
  }
  .bubble::after{
    content:""; position:absolute; top:100%; left:calc(50% + var(--tx, 0px)); width:8px; height:8px;
    background:#fff; border-right:2px solid var(--ink); border-bottom:2px solid var(--ink);
    transform:translate(-50%,-5px) rotate(45deg);
  }
  .bubble.groom, .bubble.bride, .bubble.couple{border-width:3px; padding:5px 10px 6px;}
  .bubble.groom{border-color:var(--groom); box-shadow:2px 2px 0 rgba(79,134,234,.45);}
  .bubble.bride{border-color:var(--bride); box-shadow:2px 2px 0 rgba(238,127,162,.45);}
  .bubble.couple{border-color:var(--gold);}
  .bubble.groom::after{border-right:3px solid var(--groom); border-bottom:3px solid var(--groom);}
  .bubble.bride::after{border-right:3px solid var(--bride); border-bottom:3px solid var(--bride);}
  .bubble.couple::after{border-right:3px solid var(--gold); border-bottom:3px solid var(--gold);}
  .bubble .tag{display:block; font-size:10px; line-height:1.2; margin-bottom:2px; letter-spacing:.02em;}
  .bubble.groom .tag{color:var(--groom);}
  .bubble.bride .tag{color:#d9567f;}

  /* 하단 버튼 */
  .uiBottom{
    position:absolute; left:0; right:0; bottom:20px; z-index:20; display:flex; justify-content:center;
    padding:0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
    pointer-events:none;
  }
  #joinBtn{
    pointer-events:auto; font-family:var(--font-title); font-size:18px; color:var(--ink);
    background:var(--gold); border:none; border-radius:999px; padding:14px 30px;
    box-shadow:0 5px 0 #b98a45, 0 8px 18px rgba(0,0,0,.4); cursor:pointer;
  }
  #joinBtn:active{transform:translateY(3px); box-shadow:0 2px 0 #b98a45, 0 4px 10px rgba(0,0,0,.4);}
  :focus-visible{outline:3px solid var(--gold); outline-offset:2px;}

  /* 팝업 */
  .overlay{position:fixed; inset:0; z-index:50; background:rgba(15,10,20,.82); display:none; align-items:flex-end; justify-content:center;}
  .overlay.open{display:flex;}
  .modal{
    position:relative; width:100%; max-width:480px; max-height:92dvh; overflow-y:auto;
    background:var(--ink); border-radius:22px 22px 0 0; animation:slideUp .22s ease;
  }
  @keyframes slideUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modalBody{padding:18px 18px 0;}
  .modal h2{font-family:var(--font-title); font-weight:400; font-size:19px; margin:0 0 10px; color:var(--gold); padding-right:36px;}
  .tip{margin:0 0 12px; font-size:13px; line-height:1.5; color:rgba(246,239,227,.78);}
  #closeModal{position:absolute; top:12px; right:14px; background:none; border:none; color:var(--cream); font-size:20px; padding:6px 8px; cursor:pointer; opacity:.75; z-index:2;}
  .step{display:none;}
  .step.active{display:block;}
  .camWrap{position:relative; width:100%; aspect-ratio:1/1; border-radius:16px; overflow:hidden; background:#000; margin-bottom:12px;}
  .camWrap video{width:100%; height:100%; object-fit:cover;}
  .guide{
    position:absolute; left:50%; top:16%; width:50%; height:64%; transform:translateX(-50%);
    border:3px dashed rgba(255,255,255,.85); border-radius:50%; pointer-events:none; box-shadow:0 0 0 999px rgba(0,0,0,.3);
  }
  .camRow{display:flex; gap:10px;}
  .btn{flex:1; padding:13px; border-radius:12px; border:none; font-family:var(--font-title); font-size:16px; cursor:pointer;}
  .btn-primary{background:var(--gold); color:var(--ink);}
  .btn-ghost{background:rgba(255,255,255,.1); color:var(--cream);}
  .btn:disabled{opacity:.6; cursor:default;}
  .pickWrap{position:relative; margin-top:10px;}
  .pickWrap input[type=file]{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; z-index:2; font-size:0;}
  .pickWrap .pickBtn{padding:13px; text-align:center; font-family:var(--font-title); font-size:16px; color:var(--cream); background:rgba(255,255,255,.12); border-radius:12px;}
  .pickWrap .pickBtn.primary{background:var(--gold); color:var(--ink);}
  .pickWrap input[type=file]:focus-visible + .pickBtn{outline:3px solid var(--gold); outline-offset:2px;}
  .diyBtn{width:100%; margin-top:10px; flex:none;}
  #camError{font-size:13px; color:var(--rose); margin-bottom:10px; display:none; line-height:1.5;}
  .errLine{font-size:13px; color:var(--rose); margin-top:12px; line-height:1.5;}

  /* 꾸미기 */
  .lookTop{display:flex; justify-content:center; margin-bottom:6px;}
  #previewCanvas{
    width:110px; height:180px; image-rendering:pixelated; border-radius:14px;
    background:
      linear-gradient(45deg, #2c2240 25%, transparent 25% 75%, #2c2240 75%),
      linear-gradient(45deg, #2c2240 25%, #241a37 25% 75%, #2c2240 75%);
    background-size:16px 16px; background-position:0 0, 8px 8px;
    border:2px solid var(--line);
  }
  .grp{margin-top:12px;}
  .grp > span{display:block; font-size:12px; color:rgba(246,239,227,.72); margin-bottom:6px;}
  .row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    font-family:var(--font-title); font-size:14px; color:var(--cream); background:rgba(255,255,255,.1);
    border:2px solid transparent; border-radius:999px; padding:7px 12px; cursor:pointer;
  }
  .chip.on{background:var(--gold); color:var(--ink);}
  .sw{width:32px; height:32px; border-radius:50%; border:3px solid rgba(255,255,255,.25); cursor:pointer; padding:0;}
  .sw.auto{background:linear-gradient(135deg, #2b3350 0 50%, #3d5a99 50% 100%); color:#fff; font-family:var(--font-title); font-size:10px; line-height:1;}
  .sideRow{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .sideBtn{
    font-family:var(--font-title); font-size:16px; padding:11px 8px; border-radius:12px; cursor:pointer;
    border:2px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); color:var(--cream);
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .sideBtn small{font-family:var(--font-body); font-size:12px; opacity:.8;}
  .sideBtn.groom.on{border-color:var(--groom); background:rgba(79,134,234,.25);}
  .sideBtn.bride.on{border-color:var(--bride); background:rgba(238,127,162,.25);}
  .sw.on{border-color:var(--cream); box-shadow:0 0 0 2px var(--gold);}
  label.fl{font-size:12px; color:rgba(246,239,227,.78); display:block; margin:14px 0 6px;}
  input[type=text], textarea{
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.07); color:var(--cream); font-family:var(--font-body); font-size:15px;
  }
  textarea{resize:none; height:64px;}
  .actions{position:sticky; bottom:0; background:var(--ink); padding:12px 0 calc(14px + env(safe-area-inset-bottom, 0px)); margin-top:14px;}

  #lawnFallback{display:none;}
</style>
</head>
<body>

<div id="scene">
  <canvas id="world" aria-label="야외 결혼식장 정원"></canvas>
  <div id="bubbles"></div>

  <header class="uiTop">
    <div id="couple"></div>
    <div id="subtitle">우리 결혼식에 와줘서 고마워요</div>
    <div class="metaRow">
      <div id="guestCount">하객 0명</div>
      <nav class="roomNav" id="roomNav" aria-label="방 이동">
        <button type="button">연회장<b>0</b></button>
        <button type="button" class="on">예식홀<b>0</b></button>
        <button type="button">신부대기실<b>0</b></button>
      </nav>
    </div>
  </header>

  <button class="edgeBtn" id="goLeft" type="button" aria-label="왼쪽 방으로"><i>‹</i><span>연회장</span></button>
  <button class="edgeBtn" id="goRight" type="button" aria-label="오른쪽 방으로"><span>신부대기실</span><i>›</i></button>

  <div id="emptyState" hidden>아직 아무도 오지 않았어요.<br>첫 번째 하객이 되어보세요!</div>
  <p class="notice" id="banner"></p>

  <div class="uiBottom">
    <button id="joinBtn" type="button">내 미니미 만들기</button>
  </div>
</div>

<div class="overlay" id="modalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-label="내 미니미 만들기">
    <button id="closeModal" type="button" aria-label="닫기">✕</button>
    <div class="modalBody">

      <div class="step active" id="stepCam">
        <h2>사진을 찍어주세요</h2>
        <p class="tip">얼굴을 동그라미에 맞추고 어깨까지 보이게 찍으면, 머리색과 피부색, 옷 색을 자동으로 골라드려요.</p>
        <div id="camError"></div>
        <div class="camWrap" id="camWrap">
          <video id="video" autoplay playsinline muted></video>
          <div class="guide"></div>
        </div>
        <div class="camRow">
          <button class="btn btn-primary" id="captureBtn" type="button">촬영하기</button>
        </div>
        <div class="pickWrap">
          <input type="file" id="fileInput" accept="image/*" aria-label="앨범에서 사진 고르기">
          <div class="pickBtn" id="pickLabel">앨범에서 사진 고르기</div>
        </div>
        <button class="btn btn-ghost diyBtn" id="diyBtn" type="button">사진 없이 직접 꾸미기</button>
      </div>

      <div class="step" id="stepLook">
        <h2>내 미니미 꾸미기</h2>
        <div class="lookTop"><canvas id="previewCanvas" width="22" height="36"></canvas></div>

        <div class="grp"><span>머리 모양</span><div class="row" id="hsRow"></div></div>
        <div class="grp"><span>머리색</span><div class="row" id="hairRow"></div></div>
        <div class="grp"><span>피부색</span><div class="row" id="skinRow"></div></div>
        <div class="grp"><span>옷</span><div class="row" id="outfitRow"></div></div>
        <div class="grp"><span>옷 색</span><div class="row" id="topRow"></div></div>
        <div class="grp" id="pantsGrp"><span>하의 색</span><div class="row" id="pantsRow"></div></div>
        <div class="grp"><span>소품</span><div class="row" id="accRow"></div></div>

        <div class="grp"><span>누구의 하객인가요?</span>
          <div class="sideRow" id="sideRow">
            <button type="button" class="sideBtn groom" data-side="groom" aria-pressed="false">신랑 측<small id="sideGroomName"></small></button>
            <button type="button" class="sideBtn bride" data-side="bride" aria-pressed="false">신부 측<small id="sideBrideName"></small></button>
          </div>
        </div>

        <label class="fl" for="nameInput">이름</label>
        <input type="text" id="nameInput" maxlength="12" placeholder="예: 김지은">
        <label class="fl" for="msgInput">한마디 (선택)</label>
        <textarea id="msgInput" maxlength="60" placeholder="두 사람에게 남기고 싶은 말"></textarea>
        <div id="saveError" class="errLine" hidden></div>

        <div class="actions">
          <div class="camRow">
            <button class="btn btn-ghost" id="backBtn" type="button">이전</button>
            <button class="btn btn-primary" id="submitBtn" type="button">식장에 입장하기</button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script>
/* =========================================================
   0) 바꿔 쓰는 값
========================================================= */
const BRIDE_NAME = '박지수', GROOM_NAME = '강민수';      // 식장 아치 앞에 서 있는 신부, 신랑
const BRIDE_EN = 'JISU', GROOM_EN = 'MINSU';             // 화면 맨 위 제목

/* Firebase 설정 — 본인의 Firebase 프로젝트 값으로 교체하세요.
   Firebase 콘솔 > 프로젝트 설정 > 일반 > 내 앱(웹) 에서 확인할 수 있습니다. */
const firebaseConfig = {
  apiKey: "AIzaSyCeHVHTT7r1lkbhDJaBeW-5Y7sXbao1dWc",
  authDomain: "wedding-guestbook-32c45.firebaseapp.com",
  projectId: "wedding-guestbook-32c45",
  storageBucket: "wedding-guestbook-32c45.firebasestorage.app",
  messagingSenderId: "1006778051059",
  appId: "1:1006778051059:web:74ba4cc8ab33d606948a86"
};

let db = null;

try{
  if(firebaseConfig.apiKey !== "REPLACE_ME"){
    firebase.initializeApp(firebaseConfig);

    firebaseReady = true;

}catch(e){
  console.error(e);
  showBanner("Firebase 연결에 실패했어요: " + e.message);

function showBanner(msg){
  const b = document.getElementById('banner');
  b.textContent = msg;
  b.style.display = 'block';
}
if(!firebaseReady && firebaseConfig.apiKey === "REPLACE_ME"){
  showBanner("Firebase가 아직 연결되지 않아 체험 하객만 보여드리고 있어요.");
}

/*==SPRITE_START==*/
/* =========================================================
   1) 색 도우미, 팔레트, 미니미 한 명 그리기 (22x36 도트)
========================================================= */
function hex2rgb(h){ const n = parseInt(h.slice(1), 16); return [(n>>16)&255, (n>>8)&255, n&255]; }
function rgb2hex(r,g,b){ return '#' + [r,g,b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function shade(h, f){ const c = hex2rgb(h); return rgb2hex(c[0]*f, c[1]*f, c[2]*f); }
function lighten(h, a){ const c = hex2rgb(h); return rgb2hex(c[0]+(255-c[0])*a, c[1]+(255-c[1])*a, c[2]+(255-c[2])*a); }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1 | a); t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }

const SKINS = ['#fff0e0','#ffe0c4','#f5c8a0','#e0a878','#c68642','#8d5524'];
const HAIRS = ['#1b1b1f','#3b2418','#5a2a1e','#6b4226','#a9742f','#c9a27a','#d9b660','#b5452f','#9aa0a6','#f2f2f2','#e8919c','#8e6bbf','#6fa8dc'];
const TOPS  = ['#1f1f2e','#2b3350','#f6f6f6','#e8d3b0','#8a5a3c','#7a2638','#c0392b','#f2a65a','#ffc15e','#8fd18a','#6b7a3a','#7fd6c2','#a9d4f5','#6fa8dc','#b9a4f0','#e8919c'];
const PANTS = ['#22202a','#2b3350','#3d5a99','#7a7f8a','#d8c8a8','#5a3a2a','#f2f2ee'];
const HAIR_STYLES = ['짧은 머리','가르마','긴 머리','단발','올림머리','포니테일','곱슬머리','양갈래','반삭'];
const OUTFITS = ['정장','턱시도','원피스','캐주얼','한복','후드티','블라우스·치마','니트'];
const ACCS = ['없음','안경','선글라스','리본','꽃 머리핀','비니','베레모'];
const SIDES = { groom:'신랑 측', bride:'신부 측' };
const HEXRE = /^#[0-9a-fA-F]{6}$/;
const NO_PANTS = [2, 4, 6];     // 원피스, 한복, 치마는 하의 색이 필요 없음

const SW = 22, SH = 36, FEET = 33;

function defaultLook(){ return { s:SKINS[2], h:HAIRS[1], t:TOPS[1], p:'', hs:0, o:0, a:0, v:0, side:'' }; }
function clampInt(v, lo, hi, d){ v = parseInt(v, 10); return (isNaN(v) || v < lo || v > hi) ? d : v; }
function cleanLook(r){
  const d = defaultLook();
  if(!r || typeof r !== 'object') return d;
  return {
    s: HEXRE.test(r.s) ? r.s : d.s,
    h: HEXRE.test(r.h) ? r.h : d.h,
    t: HEXRE.test(r.t) ? r.t : d.t,
    p: HEXRE.test(r.p) ? r.p : '',
    hs: clampInt(r.hs, 0, HAIR_STYLES.length - 1, 0),
    o: clampInt(r.o, 0, OUTFITS.length - 1, 0),
    a: clampInt(r.a, 0, ACCS.length - 1, r.g ? 1 : 0),
    v: 0,
    side: (r.side === 'groom' || r.side === 'bride') ? r.side : ''
  };
}
function randomLook(rnd){
  const p = a => a[Math.floor(rnd() * a.length)];
  return { s:p(SKINS), h:p(HAIRS.slice(0, 9)), t:p(TOPS), p: rnd() < 0.5 ? '' : p(PANTS),
           hs:Math.floor(rnd()*HAIR_STYLES.length), o:Math.floor(rnd()*OUTFITS.length),
           a: rnd() < 0.55 ? 0 : 1 + Math.floor(rnd()*(ACCS.length-1)), v:0,
           side: rnd() < 0.5 ? 'groom' : 'bride' };
}

function buildSprite(look, frame){
  const c = document.createElement('canvas'); c.width = SW; c.height = SH;
  const g = c.getContext('2d');
  const R = (x,y,w,h,col) => { g.fillStyle = col; g.fillRect(x,y,w,h); };
  const skin = look.s, skinSh = shade(skin, .86);
  const hair = look.h, hairHi = lighten(hair, .38), hairSh = shade(hair, .8);
  const top = look.t, topSh = shade(top, .78), topHi = lighten(top, .22);
  const o = look.o, hs = look.hs, a = look.a || 0, w1 = frame === 1;
  const skirtLike = (o === 2 || o === 4);           // 원피스, 한복: 다리가 안 보임
  const autoPants = (o === 3 || o === 5) ? '#3d5a99' : (o === 7 ? '#2b2433' : shade(top, .85));
  const pants = look.p || autoPants;
  const shoe = (o === 3 || o === 5) ? '#f4f4f4' : '#2b2433';
  const cream = '#fbf6ec';

  /* 뒤쪽 머리카락 */
  if(hs === 2) R(4,6,14,19,hair);
  if(hs === 3) R(4,6,14,10,hair);
  if(hs === 5){ R(16,5,3,3,hair); R(17,8,3,9,hair); R(18,17,2,2,hairSh); R(16,6,1,1,'#e84a6a'); }
  if(hs === 6){ R(3,5,16,11,hair); R(2,8,1,6,hair); R(19,8,1,6,hair); }
  if(hs === 7){ R(1,9,4,9,hair); R(17,9,4,9,hair); R(1,17,3,2,hairSh); R(18,17,3,2,hairSh); R(3,9,2,2,'#e84a6a'); R(17,9,2,2,'#e84a6a'); }

  /* 다리와 신발 */
  if(skirtLike){
    const sh = o === 4 ? '#f6f0e6' : '#3a2a3a';
    R(8,31,2,1,o === 4 ? sh : skin); R(12,31,2,1,o === 4 ? sh : skin);
    R(7,w1?31:32,3,1,sh); R(12,32,3,1,sh);
  } else if(o === 6){
    const ly = w1 ? 1 : 0;
    R(8,29,2,2-ly,skin); R(12,29,2,2,skin);
    R(7,31-ly,3,1,shoe); R(12,31,3,1,shoe);
  } else {
    const ly = w1 ? 1 : 0;
    R(8,26,3,5-ly,pants); R(7,31-ly,4,2,shoe);
    R(11,26,3,5,pants);   R(11,31,4,2,shoe);
    R(10,26,1,5-ly,shade(pants,.8)); R(11,26,1,5,shade(pants,.8));
  }

  /* 몸통과 팔 */
  const swL = w1 ? 1 : 0, swR = w1 ? 1 : 0;
  if(o === 2){                                   /* 원피스 */
    R(7,18,8,6,top); R(7,23,8,1,topSh); R(9,18,4,1,skin);
    const rows = [[6,10],[6,10],[5,12],[5,12],[4,14],[4,14],[4,14]];
    rows.forEach((r,i) => R(r[0],24+i,r[1],1,top));
    R(4,30,14,1,topSh); R(8,26,1,4,topSh); R(13,26,1,4,topSh); R(14,19,1,4,topSh);
    R(5,19,2,2,top); R(15,19,2,2,top);
    R(5,21,2,6-swL,skin); R(15,21,2,6+swR,skin);
  } else if(o === 4){                            /* 한복: 흰 저고리 + 색 치마 */
    const rows = [[6,10],[5,12],[5,12],[4,14],[4,14],[4,14],[3,16],[3,16],[3,16]];
    rows.forEach((r,i) => R(r[0],22+i,r[1],1,top));
    R(3,30,16,1,topSh); R(7,24,1,6,topSh); R(14,24,1,6,topSh); R(10,23,1,7,topHi);
    R(7,18,8,4,cream); R(7,21,8,1,'#e9dfcf');
    R(9,18,1,3,'#ffffff'); R(12,18,1,3,'#ffffff'); R(10,18,2,1,'#ffffff');
    R(11,20,3,1,topSh); R(12,21,1,3,topSh); R(13,21,1,2,topSh);
    R(5,19,2,5-swL,cream); R(15,19,2,5+swR,cream);
    R(5,23-swL,2,1,top); R(15,23+swR,2,1,top);
    R(5,24-swL,2,2,skin); R(15,24+swR,2,2,skin);
  } else if(o === 6){                            /* 블라우스 + 치마 */
    R(7,18,8,6,cream); R(14,19,1,4,'#e9dfcf');
    R(9,18,1,2,'#ffffff'); R(12,18,1,2,'#ffffff'); R(10,18,2,1,skin);
    R(10,20,2,1,'#e9dfcf'); R(10,22,2,1,'#e9dfcf');
    R(5,19,2,6-swL,cream); R(15,19,2,6+swR,cream);
    R(5,25-swL,2,2,skin); R(15,25+swR,2,2,skin);
    const rows = [[7,8],[6,10],[6,10],[5,12],[5,12]];
    rows.forEach((r,i) => R(r[0],24+i,r[1],1,top));
    R(7,24,8,1,topSh); R(9,26,1,3,topSh); R(12,26,1,3,topSh);
  } else {
    R(7,18,8,8,top); R(14,19,1,6,topSh); R(8,18,6,1,topSh);
    R(5,19,2,6-swL,top); R(15,19,2,6+swR,top);
    R(5,25-swL,2,2,skin); R(15,25+swR,2,2,skin);
    if(o === 0){                                 /* 정장 */
      R(10,18,2,6,'#f4f4f4'); R(10,20,2,4,'#c0392b'); R(10,19,2,1,'#8f2a20');
      R(9,18,1,4,topSh); R(12,18,1,4,topSh);
    } else if(o === 1){                          /* 턱시도 */
      R(9,18,4,5,'#f6f6f6'); R(9,18,4,2,'#2a2a2a'); R(10,18,2,1,'#c0392b'); R(7,23,8,1,'#222222');
      R(8,18,1,5,topSh); R(13,18,1,5,topSh);
    } else if(o === 5){                          /* 후드티 */
      R(7,17,8,2,topSh); R(8,18,6,1,top);
      R(10,19,1,2,'#f4f4f4'); R(12,19,1,2,'#f4f4f4');
      R(8,22,6,2,topSh); R(8,22,6,1,top);
      R(5,24-swL,2,1,topSh); R(15,24+swR,2,1,topSh);
    } else if(o === 7){                          /* 니트 (터틀넥) */
      R(8,17,6,2,top); R(8,17,6,1,topHi);
      for(let y=19;y<26;y+=2) R(7,y,8,1,topHi);
      R(5,24-swL,2,1,topHi); R(15,24+swR,2,1,topHi);
    } else {                                     /* 캐주얼 */
      R(9,18,4,1,topSh); R(12,21,2,2,topHi);
    }
  }

  /* 얼굴 */
  R(6,6,10,1,skin); R(5,7,12,9,skin); R(6,16,10,1,skin); R(7,17,8,1,skinSh);
  R(7,11,2,3,'#2a1b24'); R(13,11,2,3,'#2a1b24');
  R(7,11,1,1,'#ffffff'); R(13,11,1,1,'#ffffff');
  R(6,15,2,1,'#ff9aa2'); R(14,15,2,1,'#ff9aa2');
  R(10,15,2,1,'#b5524a');

  /* 앞쪽 머리카락 */
  if(hs === 8){                                  /* 반삭 */
    R(7,4,8,1,hairSh); R(5,5,12,2,hairSh); R(5,7,1,2,hairSh); R(16,7,1,2,hairSh);
    for(let i=6;i<16;i+=3) R(i,5,1,1,skinSh);
  } else {
    R(7,3,8,1,hair); R(6,4,10,1,hair); R(5,5,12,2,hair);
    R(8,4,3,1,hairHi);
    if(hs === 0 || hs === 2 || hs === 4 || hs === 5){
      R(5,7,4,1,hair); R(13,7,4,1,hair); R(5,8,2,1,hair); R(15,8,2,1,hair); R(5,9,1,2,hair); R(16,9,1,2,hair);
    } else if(hs === 1){
      R(5,7,12,1,hair); R(5,8,6,1,hair); R(5,9,3,1,hair); R(16,8,1,3,hair);
    } else if(hs === 6){
      R(4,4,14,3,hair); R(5,7,3,2,hair); R(9,7,2,1,hair); R(12,7,2,1,hair); R(15,7,3,2,hair);
      R(4,8,1,6,hair); R(17,8,1,6,hair);
      [[6,3],[10,2],[14,3],[5,6],[16,6],[8,5],[12,5]].forEach(q => R(q[0],q[1],1,1,hairHi));
    } else {
      R(5,7,12,1,hair); R(5,8,3,1,hair); R(14,8,3,1,hair);
    }
    if(hs === 4){ R(9,1,4,1,hair); R(8,2,6,1,hair); R(10,1,1,1,hairHi); }
    if(hs === 2){ R(4,7,2,16,hair); R(16,7,2,16,hair); R(4,22,2,1,hairSh); R(16,22,2,1,hairSh); }
    if(hs === 3){ R(4,7,2,9,hair); R(16,7,2,9,hair); R(4,15,2,1,hairSh); R(16,15,2,1,hairSh); }
    if(hs === 7){ R(4,7,1,3,hair); R(17,7,1,3,hair); }
  }

  /* 소품 */
  if(a === 1){                                   /* 안경 */
    const f = '#3b3340';
    R(6,10,4,1,f); R(6,14,4,1,f); R(6,11,1,3,f); R(9,11,1,3,f);
    R(12,10,4,1,f); R(12,14,4,1,f); R(12,11,1,3,f); R(15,11,1,3,f);
    R(10,11,2,1,f);
  } else if(a === 2){                            /* 선글라스 */
    R(6,10,4,4,'#1b1b22'); R(12,10,4,4,'#1b1b22'); R(10,11,2,1,'#1b1b22');
    R(5,10,1,1,'#1b1b22'); R(16,10,1,1,'#1b1b22');
    R(7,11,1,1,'#6a6a7a'); R(13,11,1,1,'#6a6a7a');
  } else if(a === 3){                            /* 리본 */
    R(13,2,2,3,'#e84a6a'); R(17,2,2,3,'#e84a6a'); R(15,3,2,1,'#b8304e'); R(13,2,1,1,'#ff8aa5'); R(17,2,1,1,'#ff8aa5');
  } else if(a === 4){                            /* 꽃 머리핀 */
    R(15,5,3,1,'#ff9ec0'); R(16,4,1,3,'#ff9ec0'); R(16,5,1,1,'#ffe066'); R(14,7,1,1,'#7aa56d');
  } else if(a === 5){                            /* 비니 */
    const bn = shade(top, .95), bnH = lighten(top, .3);
    R(6,1,10,1,bn); R(5,2,12,4,bn); R(4,5,14,2,bnH);
    for(let x=6;x<17;x+=2) R(x,2,1,3,shade(bn,.85));
    R(10,0,2,1,bnH);
  } else if(a === 6){                            /* 베레모 */
    R(6,2,11,1,'#7a2638'); R(4,3,14,2,'#7a2638'); R(4,5,10,1,'#5e1c2b'); R(11,1,1,1,'#5e1c2b'); R(7,3,3,1,'#9a3a50');
  }

  /* 면사포 (신부 전용) */
  if(look.v){
    const vc = '#f1ecff';
    R(6,2,10,1,vc); R(3,7,2,18,vc); R(17,7,2,18,vc); R(3,24,2,1,'#d9d2f0'); R(17,24,2,1,'#d9d2f0');
  }

  /* 바깥 테두리 */
  const img = g.getImageData(0,0,SW,SH);
  const d = img.data, out = new Uint8ClampedArray(d);
  const A = (x,y) => (x<0||y<0||x>=SW||y>=SH) ? 0 : d[(y*SW+x)*4+3];
  for(let y=0;y<SH;y++) for(let x=0;x<SW;x++){
    if(d[(y*SW+x)*4+3] === 0 && (A(x-1,y)>0 || A(x+1,y)>0 || A(x,y-1)>0 || A(x,y+1)>0)){
      const i = (y*SW+x)*4; out[i]=0x2a; out[i+1]=0x1b; out[i+2]=0x2e; out[i+3]=255;
    }
  }
  g.putImageData(new ImageData(out, SW, SH), 0, 0);
  return c;
}

const spriteCache = new Map();
function getSprite(look, frame, flip){
  const key = [look.s, look.h, look.t, look.p, look.hs, look.o, look.a, look.v, frame, flip ? 1 : 0].join('|');
  let s = spriteCache.get(key);
  if(s) return s;
  const base = buildSprite(look, frame);
  if(!flip){ s = base; }
  else {
    s = document.createElement('canvas'); s.width = SW; s.height = SH;
    const g = s.getContext('2d');
    g.translate(SW, 0); g.scale(-1, 1); g.drawImage(base, 0, 0);
  }
  spriteCache.set(key, s);
  return s;
}

/* =========================================================
   2) 예식홀 배경 그리기 (도트 한 칸 = 화면의 P픽셀)
   별이 흐르는 파란 LED 벽, 샹들리에, 거울 같은 버진로드, 흰 꽃줄과 촛대
========================================================= */
let AW = 0, AH = 0, P = 3;
let dprNow = 1;
const world = { cx:0, archTopY:0, archBaseY:0, pathW:60, sideW:16, bulbs:[], stars:[], flies:[] };

function P32(hex){ const c = hex2rgb(hex); return ((255<<24) | (c[2]<<16) | (c[1]<<8) | c[0]); }

function buildWorld(){
  const w = AW, h = AH;
  const buf = new Uint32Array(w*h);
  const rnd = mulberry32(5150);
  const px = (x,y,c) => { x = Math.round(x); y = Math.round(y); if(x>=0 && y>=0 && x<w && y<h) buf[y*w+x] = c; };
  const rect = (x,y,ww,hh,c) => { for(let j=0;j<hh;j++) for(let i=0;i<ww;i++) px(x+i,y+j,c); };
  const disc = (cx,cy,r,c) => { for(let j=-r;j<=r;j++) for(let i=-r;i<=r;i++) if(i*i+j*j <= r*r + r*0.6) px(cx+i,cy+j,c); };
  const mix = (a,b,k) => { const A = hex2rgb(a), B = hex2rgb(b); return P32(rgb2hex(A[0]+(B[0]-A[0])*k, A[1]+(B[1]-A[1])*k, A[2]+(B[2]-A[2])*k)); };

  const cx = Math.round(w/2);
  const ceilB = Math.round(h*0.075);
  const wallTop = ceilB, wallBot = Math.round(h*0.255);
  const stageB = Math.round(h*0.30);
  const pathW = Math.min(56, Math.round(w*0.26));
  const pl = cx - Math.round(pathW/2), pr = cx + Math.round(pathW/2);
  const sideW = Math.max(14, Math.round(w*0.09));
  Object.assign(world, { cx, archTopY:wallTop, archBaseY:stageB, pathW, sideW });
  world.bulbs = []; world.stars = []; world.flies = [];

  /* 바닥: 광택 있는 검은 바닥 */
  const floorA = P32('#0d0b13'), floorB = P32('#110e18'), floorS = P32('#1b1724');
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const r = rnd();
    buf[y*w+x] = r < 0.02 ? floorS : ((((x>>3)+(y>>3)) & 1) ? floorA : floorB);
  }

  /* 천장: 마름모 격자 + 스포트 조명 */
  const ceil = P32('#07050c'), ceilLine = P32('#15111f');
  for(let y=0;y<ceilB;y++) for(let x=0;x<w;x++){
    const d1 = (x + y) % 16, d2 = (x - y + 1600) % 16;
    buf[y*w+x] = (d1 === 0 || d2 === 0) ? ceilLine : ceil;
  }
  for(let x=10;x<w;x+=22){
    const y = 4 + ((x/22|0) % 2) * 6;
    px(x,y,P32('#fff1cf'));
    world.bulbs.push({ x, y, ph: rnd()*6.28, warm:1 });
  }

  /* LED 벽: 깊은 파랑 + 별 */
  for(let y=wallTop;y<wallBot;y++){
    const k = (y - wallTop) / (wallBot - wallTop);
    const base = k < 0.5 ? mix('#081142', '#1a3aa6', k*2) : mix('#1a3aa6', '#0c1d68', (k-0.5)*2);
    for(let x=0;x<w;x++){
      const r = rnd();
      let c = base;
      if(r < 0.035) c = P32('#4f78e0');
      else if(r < 0.05) c = P32('#2a4fc0');
      buf[y*w+x] = c;
    }
  }
  /* 은하수처럼 흐르는 띠 */
  for(let i=0;i<w*2.2;i++){
    const x = rnd()*w;
    const band = wallTop + (wallBot-wallTop)*(0.55 - 0.25*(x/w)) + (rnd()-0.5)*14;
    px(x, band, rnd() < 0.5 ? P32('#8fb1ff') : P32('#c9d8ff'));
  }
  for(let i=0;i<Math.round(w*(wallBot-wallTop)/55);i++){
    const x = Math.round(rnd()*w), y = Math.round(wallTop + 1 + rnd()*(wallBot-wallTop-2));
    px(x,y,P32('#ffffff'));
    if(rnd() < 0.18){ px(x-1,y,P32('#9fbaff')); px(x+1,y,P32('#9fbaff')); px(x,y-1,P32('#9fbaff')); px(x,y+1,P32('#9fbaff')); }
    if(rnd() < 0.45) world.stars.push({ x, y, ph: rnd()*6.28, sp: 1 + rnd()*2 });
  }
  /* 벽 양끝 기둥 */
  const pillar = P32('#1c1826'), pillarHi = P32('#2b2638');
  rect(0, wallTop, 5, wallBot-wallTop, pillar); rect(4, wallTop, 1, wallBot-wallTop, pillarHi);
  rect(w-5, wallTop, 5, wallBot-wallTop, pillar); rect(w-5, wallTop, 1, wallBot-wallTop, pillarHi);
  rect(0, wallBot, w, 1, P32('#2a2535'));

  /* 단상 */
  for(let y=wallBot+1;y<stageB;y++) for(let x=0;x<w;x++){ buf[y*w+x] = ((x+y)&3) ? P32('#14111c') : P32('#181421'); }
  rect(0, stageB-1, w, 1, P32('#2d2838'));

  /* 꽃 모양 도우미 */
  const WH = ['#f6f7f2','#eef1ea','#e2e7de','#ffffff'].map(P32);
  const SH = P32('#c4ccc0');
  const LEAF = ['#3f6b45','#5d8a5a','#7aa56d'].map(P32);
  const ACC = ['#f3b8c6','#f6caa0','#fbe3a6','#e9a6b8'].map(P32);
  const hydrangea = (x,y,r) => {
    disc(x,y,r,SH);
    disc(x-1,y-1,Math.max(1,r-1),WH[(rnd()*3)|0]);
    for(let i=0;i<r*3;i++){ const a = rnd()*6.28, d = rnd()*r; px(x+Math.cos(a)*d, y+Math.sin(a)*d, rnd()<.5 ? WH[3] : SH); }
  };
  const leafy = (x,y) => { px(x,y,LEAF[(rnd()*3)|0]); px(x+1,y,LEAF[(rnd()*3)|0]); px(x,y+1,LEAF[0]); };
  const accent = (x,y) => { const c = ACC[(rnd()*ACC.length)|0]; px(x,y,c); px(x+1,y,c); px(x,y+1,c); px(x+1,y+1,c); px(x,y-1,P32('#ffe39a')); };

  /* 단상 위 꽃 테이블 */
  rect(cx-20, wallBot+3, 40, 3, P32('#2a2433'));
  for(let i=0;i<14;i++) hydrangea(cx-18 + i*2.8, wallBot+2, 2);
  for(let i=0;i<10;i++) leafy(cx-20 + rnd()*40, wallBot + 3 + rnd()*3);

  /* 버진로드: 파란 LED가 비치는 거울 */
  for(let y=stageB;y<h;y++){
    const k = (y - stageB) / Math.max(1, h - stageB);
    const base = mix('#132a86', '#050816', Math.min(1, k*1.15));
    for(let x=pl;x<=pr;x++){
      const edge = Math.min(x-pl, pr-x);
      buf[y*w+x] = edge < 2 ? P32('#0a0f2a') : base;
    }
  }
  for(let i=0;i<Math.round(pathW*(h-stageB)/70);i++){
    const x = pl + 3 + rnd()*(pathW-6), y = stageB + rnd()*(h-stageB);
    const k = (y - stageB) / (h - stageB);
    if(rnd() > k*0.9){ px(x,y, rnd()<0.6 ? P32('#7d9cf0') : P32('#d6e2ff')); if(rnd() < 0.35) world.stars.push({ x:Math.round(x), y:Math.round(y), ph: rnd()*6.28, sp: 0.8 + rnd()*1.5, dim:1 }); }
  }

  /* 버진로드 양옆 흰 꽃줄 */
  for(let y=stageB-2;y<h+4;y+=3){
    hydrangea(pl - 3 + ((rnd()*2)|0), y, 3);
    hydrangea(pr + 3 - ((rnd()*2)|0), y + 1, 3);
    leafy(pl - 6 - ((rnd()*2)|0), y); leafy(pr + 5 + ((rnd()*2)|0), y + 1);
    if(rnd() < 0.5){ leafy(pl - 4, y + 2); leafy(pr + 3, y + 2); }
    if(rnd() < 0.3) accent(pl - 6 + ((rnd()*3)|0), y);
    if(rnd() < 0.3) accent(pr + 4 + ((rnd()*3)|0), y);
  }

  /* 하객석 쪽 긴 테이블 + 화병 + 촛대 */
  const tblL0 = sideW + 3, tblL1 = pl - 9, tblR0 = pr + 9, tblR1 = w - sideW - 3;
  const table = P32('#1a1622'), tableHi = P32('#262131');
  const candelabra = (x, baseY) => {
    const silver = P32('#c9ced8'), silverSh = P32('#8f95a3');
    rect(x-2, baseY, 5, 1, silverSh);
    rect(x, baseY-16, 1, 16, silver);
    rect(x-4, baseY-12, 9, 1, silver); rect(x-4, baseY-14, 1, 2, silver); rect(x+4, baseY-14, 1, 2, silver);
    rect(x-2, baseY-15, 5, 1, silverSh); rect(x-2, baseY-17, 1, 2, silver); rect(x+2, baseY-17, 1, 2, silver);
    [[x-4,baseY-17],[x-2,baseY-20],[x,baseY-21],[x+2,baseY-20],[x+4,baseY-17]].forEach(c => {
      rect(c[0], c[1], 1, 3, P32('#f7f3ea'));
      px(c[0], c[1]-1, P32('#ffd27a'));
      world.bulbs.push({ x:c[0], y:c[1]-1, ph: rnd()*6.28, warm:1, small:1 });
    });
  };
  for(const [x0,x1] of [[tblL0,tblL1],[tblR0,tblR1]]){
    if(x1 - x0 < 6) continue;
    rect(x0, stageB+4, x1-x0, h-stageB-4, table);
    rect(x0, stageB+4, x1-x0, 1, tableHi);
    for(let y=stageB+10;y<h;y+=9){
      const vx = x0 + 2 + ((rnd()*(x1-x0-4))|0);
      px(vx, y, P32('#9fb2c8')); px(vx, y+1, P32('#9fb2c8'));
      if(rnd() < 0.6) accent(vx, y-2); else hydrangea(vx, y-2, 1);
      if(rnd() < 0.5) leafy(vx-1, y-1);
    }
    for(let y=stageB+30;y<h;y+=58) candelabra(Math.round((x0+x1)/2), y);
  }

  /* 양옆 꽃 벽 (앞쪽 장식) */
  for(let y=wallTop;y<h+6;y+=4){
    for(const side of [0, 1]){
      const bx = side === 0 ? Math.round(rnd()*sideW*0.7) : w - 1 - Math.round(rnd()*sideW*0.7);
      for(let i=0;i<9;i++) leafy(bx + (rnd()-0.5)*sideW*1.2, y + (rnd()-0.5)*5);
      if(rnd() < 0.8) hydrangea(bx, y, 2 + ((rnd()*3)|0));
      if(rnd() < 0.55) accent(bx + (rnd()-0.5)*8, y + 2);
      if(rnd() < 0.15){ const c = P32('#f5d36b'); px(bx+2,y-2,c); px(bx+3,y-2,c); px(bx+2,y-3,P32('#fff1b5')); }
    }
  }

  /* 샹들리에 (버진로드 위로 겹겹이) */
  const gold = P32('#b9a26a');
  const CR = ['#ffffff','#e3ecff','#b7c9ef','#8ea7da'].map(P32);
  const chandelier = (x, topY, s) => {
    for(let y=0;y<topY;y++) if(y % 2 === 0) px(x, y, gold);
    const tiers = [[3,1],[6,2],[9,2],[7,2],[4,2],[2,1]].map(t => [Math.round(t[0]*s), Math.max(1, Math.round(t[1]*s))]);
    let y = topY;
    tiers.forEach((t, ti) => {
      for(let j=0;j<t[1];j++){
        for(let i=-t[0];i<=t[0];i++) px(x+i, y, CR[(Math.abs(i)+j+ti) % 4]);
        y++;
      }
      if(ti === 1 || ti === 2){
        for(let i=-t[0];i<=t[0];i+=Math.max(2, Math.round(3*s))){
          px(x+i, y-t[1]-1, P32('#fff4d6'));
          world.bulbs.push({ x:x+i, y:y-t[1]-1, ph: rnd()*6.28, warm:1, small:1 });
        }
      }
      if(ti === 3){ for(let i=-t[0];i<=t[0];i+=2) for(let d=0; d<Math.round(3*s); d++) px(x+i, y+d, CR[(d+i)&1 ? 1 : 2]); }
    });
    px(x, y, CR[0]); px(x, y+1, CR[2]);
  };
  chandelier(cx, 1, 1.9);
  chandelier(cx, Math.round(h*0.105), 1.45);
  chandelier(cx, Math.round(h*0.17), 1.0);

  /* 버진로드에 비친 샹들리에 */
  const refl = (x, y, s) => {
    for(let j=0;j<Math.round(10*s);j++){
      const ww = Math.round((4 + 4*Math.sin(j/Math.max(1,10*s)*Math.PI)) * s);
      for(let i=-ww;i<=ww;i++) if((i+j)&1) px(x+i, y+j, P32('#4c62a8'));
    }
  };

  const bg = document.createElement('canvas'); bg.width = w; bg.height = h;
  bg.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(buf.buffer), w, h), 0, 0);
  return bg;
}

/* =========================================================
   2-1) 다른 방 배경: 왼쪽 연회장, 오른쪽 신부대기실
========================================================= */
function painter(seed){
  const w = AW, h = AH;
  const buf = new Uint32Array(w*h);
  const rnd = mulberry32(seed);
  const px = (x,y,c) => { x = Math.round(x); y = Math.round(y); if(x>=0 && y>=0 && x<w && y<h) buf[y*w+x] = c; };
  const rect = (x,y,ww,hh,c) => { for(let j=0;j<hh;j++) for(let i=0;i<ww;i++) px(x+i,y+j,c); };
  const disc = (cx,cy,r,c) => { for(let j=-r;j<=r;j++) for(let i=-r;i<=r;i++) if(i*i+j*j <= r*r + r*0.6) px(cx+i,cy+j,c); };
  const ell = (cx,cy,rx,ry,c) => { for(let j=-ry;j<=ry;j++) for(let i=-rx;i<=rx;i++) if((i*i)/(rx*rx+0.01) + (j*j)/(ry*ry+0.01) <= 1) px(cx+i,cy+j,c); };
  const mix = (a,b,k) => { const A = hex2rgb(a), B = hex2rgb(b); return P32(rgb2hex(A[0]+(B[0]-A[0])*k, A[1]+(B[1]-A[1])*k, A[2]+(B[2]-A[2])*k)); };
  const toCanvas = () => {
    const bg = document.createElement('canvas'); bg.width = w; bg.height = h;
    bg.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(buf.buffer), w, h), 0, 0);
    return bg;
  };
  return { w, h, buf, rnd, px, rect, disc, ell, mix, toCanvas };
}

/* 왼쪽: 연회장 (뷔페, 웨딩 케이크, 원형 테이블) */
function buildBanquet(){
  const { w, h, buf, rnd, px, rect, disc, ell, mix, toCanvas } = painter(808);
  const bulbs = [], stars = [];
  const wallB = Math.round(h*0.2);

  /* 카펫 */
  const carpet = P32('#4a1622'), carpet2 = P32('#521a27'), lat = P32('#7a4a2a'), med = P32('#9a6a3a');
  for(let y=wallB;y<h;y++) for(let x=0;x<w;x++){
    const d1 = (x + y) % 14, d2 = (x - y + 1400) % 14;
    let c = ((x>>2)+(y>>2)) & 1 ? carpet : carpet2;
    if(d1 === 0 || d2 === 0) c = lat;
    if(d1 === 7 && d2 === 7) c = med;
    buf[y*w+x] = c;
  }

  /* 벽: 짙은 웜톤 패널 */
  for(let y=0;y<wallB;y++){
    const k = y / wallB;
    const base = mix('#22151c', '#3a2630', k);
    for(let x=0;x<w;x++) buf[y*w+x] = base;
  }
  for(let x=4;x<w-4;x+=26) { rect(x, Math.round(wallB*0.62), 22, Math.round(wallB*0.3), P32('#46303a')); rect(x, Math.round(wallB*0.62), 22, 1, P32('#5a4048')); }
  rect(0, wallB-3, w, 2, P32('#b9925a')); rect(0, wallB-1, w, 1, P32('#6b4a2a'));
  rect(0, 2, w, 1, P32('#8a6a3a'));

  /* 아치 창문 (밤하늘) */
  const winW = 20, winH = Math.round(wallB*0.5), winTop = Math.round(h*0.03);
  [0.22, 0.5, 0.78].forEach(fx => {
    const x0 = Math.round(w*fx - winW/2);
    for(let y=0;y<winH;y++){
      for(let i=0;i<winW;i++){
        const dx = i - winW/2 + 0.5, top = winW/2;
        if(y < top && dx*dx + (y-top)*(y-top) > top*top) continue;
        px(x0+i, winTop+y, mix('#0d1a44', '#2a3f80', y/winH));
      }
    }
    for(let y=0;y<winH;y++){ px(x0-1, winTop+y, P32('#cfb27a')); px(x0+winW, winTop+y, P32('#cfb27a')); }
    for(let i=0;i<=winW;i++){
      const dx = i - winW/2, top = winW/2;
      const yy = winTop + Math.round(top - Math.sqrt(Math.max(0, top*top - dx*dx))) - 1;
      px(x0+i, yy, P32('#cfb27a'));
    }
    rect(x0, winTop+winH, winW, 2, P32('#cfb27a'));
    rect(x0+Math.round(winW/2), winTop+3, 1, winH-3, P32('#cfb27a'));
    rect(x0, winTop+Math.round(winH*0.55), winW, 1, P32('#cfb27a'));
    for(let i=0;i<4;i++){
      const sx = x0 + 2 + Math.round(rnd()*(winW-4)), sy = winTop + 5 + Math.round(rnd()*(winH-8));
      px(sx, sy, P32('#e6eeff'));
      stars.push({ x:sx, y:sy, ph:rnd()*6.28, sp:1+rnd()*2, dim:1 });
    }
  });
  /* 벽 조명 */
  [0.36, 0.64, 0.08, 0.92].forEach(fx => {
    const x = Math.round(w*fx), y = Math.round(wallB*0.38);
    rect(x-1, y+2, 3, 3, P32('#c9a25a')); rect(x, y+5, 1, 2, P32('#8a6a3a'));
    px(x, y+1, P32('#fff1cf'));
    bulbs.push({ x, y:y+1, ph:rnd()*6.28 });
  });

  /* 뷔페 테이블 */
  const by = wallB + 2, bx0 = Math.round(w*0.08), bx1 = Math.round(w*0.92);
  rect(bx0, by, bx1-bx0, 4, P32('#f3eee6'));
  rect(bx0, by+4, bx1-bx0, 6, P32('#e2d9cc'));
  for(let x=bx0;x<bx1;x+=3) rect(x, by+5, 1, 5, P32('#cfc5b6'));
  rect(bx0, by+10, bx1-bx0, 1, P32('#2a1018'));
  const FOOD = ['#e8674a','#f2c14e','#7fbf5a','#f29e74','#c96a3a','#f5e6c8'].map(P32);
  for(let x=bx0+4;x<bx1-4;x+=9){
    if(Math.abs(x - w/2) < 12) continue;
    if(((x/9)|0) % 2){
      ell(x, by+1, 3, 2, P32('#c9ced8')); px(x, by-2, P32('#8f95a3')); px(x-1, by, P32('#ffffff'));
    } else {
      ell(x, by+2, 3, 1, P32('#ffffff'));
      for(let k=0;k<4;k++) px(x-2+k, by+1+(k&1), FOOD[(rnd()*FOOD.length)|0]);
    }
  }
  /* 웨딩 케이크 */
  const cx = Math.round(w/2);
  rect(cx-7, by-1, 15, 3, P32('#c9ced8'));
  rect(cx-6, by-6, 13, 5, P32('#fffaf3')); rect(cx-6, by-2, 13, 1, P32('#f3b8c6'));
  rect(cx-4, by-10, 9, 4, P32('#fffaf3')); rect(cx-4, by-7, 9, 1, P32('#f3b8c6'));
  rect(cx-2, by-13, 5, 3, P32('#fffaf3')); rect(cx-2, by-11, 5, 1, P32('#f3b8c6'));
  px(cx-1, by-14, P32('#e9a6b8')); px(cx+1, by-14, P32('#e9a6b8')); px(cx, by-15, P32('#ffe39a'));
  for(let k=-5;k<=5;k+=2) px(cx+k, by-6, P32('#f6caa0'));

  /* 원형 테이블 */
  const tableTop = wallB + 30, rowsN = 4;
  const gapY = Math.max(30, Math.round((h - tableTop - 18) / (rowsN - 0.4)));
  const cols = w > 260 ? [0.2, 0.5, 0.8] : [0.27, 0.73];
  const FL = ['#f3b8c6','#ffffff','#f6caa0','#e9a6b8'].map(P32);
  for(let r=0;r<rowsN;r++){
    cols.forEach((fx, ci) => {
      const tx = Math.round(w*fx + ((r % 2) ? 6 : -6)), ty = tableTop + r*gapY;
      if(ty > h - 10) return;
      for(let k=0;k<8;k++){
        const a = k/8*Math.PI*2 + 0.2;
        const chx = Math.round(tx + Math.cos(a)*16), chy = Math.round(ty + Math.sin(a)*11);
        rect(chx-1, chy-1, 3, 3, P32('#c8a25a')); px(chx, chy+1, P32('#6b4a2a'));
      }
      ell(tx, ty+2, 13, 9, P32('#2a1018'));
      ell(tx, ty, 13, 9, P32('#f4f1ea'));
      for(let i=-12;i<=12;i++) px(tx+i, ty+8 - Math.round((i*i)/40), P32('#d6cfc3'));
      for(let k=0;k<6;k++){
        const a = k/6*Math.PI*2;
        px(Math.round(tx + Math.cos(a)*9), Math.round(ty + Math.sin(a)*6), P32('#ffffff'));
        px(Math.round(tx + Math.cos(a)*9)+1, Math.round(ty + Math.sin(a)*6), P32('#cfc8bb'));
      }
      disc(tx, ty-1, 2, P32('#5d8a5a'));
      for(let k=0;k<5;k++) px(tx-2+((rnd()*5)|0), ty-2+((rnd()*3)|0), FL[(rnd()*FL.length)|0]);
      px(tx-3, ty-3, P32('#fff4d6')); px(tx+3, ty-3, P32('#fff4d6'));
      bulbs.push({ x:tx-3, y:ty-3, ph:rnd()*6.28, small:1 });
      bulbs.push({ x:tx+3, y:ty-3, ph:rnd()*6.28, small:1 });
    });
  }

  /* 가장자리 어둡게 */
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const ex = Math.abs(x - w/2) / (w/2), ey = y / h;
    const dk = Math.max(0, ex - 0.7) * 0.9 + Math.max(0, ey - 0.85) * 1.2;
    if(dk <= 0) continue;
    const c = buf[y*w+x];
    const f = 1 - Math.min(0.6, dk);
    buf[y*w+x] = (255<<24) | (Math.round(((c>>16)&255)*f)<<16) | (Math.round(((c>>8)&255)*f)<<8) | Math.round((c&255)*f);
  }

  return { key:'banquet', name:'연회장', bg: toCanvas(), bulbs, stars, minY: by + 22, minX: 8, maxX: w - 8 };
}

/* 오른쪽: 신부대기실 (꽃벽 포토존, 소파, 거울, 드레스) */
function buildBridal(){
  const { w, h, buf, rnd, px, rect, disc, ell, mix, toCanvas } = painter(4242);
  const bulbs = [], stars = [];
  const wallB = Math.round(h*0.33);
  const cx = Math.round(w/2);

  /* 대리석 바닥 */
  const m1 = P32('#efe8ea'), m2 = P32('#f5f0f1'), vein = P32('#d8cdd0');
  for(let y=wallB;y<h;y++) for(let x=0;x<w;x++){
    buf[y*w+x] = ((((x/18)|0) + ((y/18)|0)) & 1) ? m1 : m2;
  }
  for(let v=0;v<Math.round(w*h/2600);v++){
    let x = rnd()*w, y = wallB + rnd()*(h-wallB);
    for(let s=0;s<22;s++){ px(x, y, vein); x += rnd()*2-0.6; y += rnd()*1.4-0.3; }
  }

  /* 벽지: 블러시 핑크 다마스크 + 흰 웨인스코팅 */
  const wall = P32('#f3d9de'), motif = P32('#f9e8eb');
  for(let y=0;y<wallB;y++) for(let x=0;x<w;x++) buf[y*w+x] = wall;
  for(let y=6;y<wallB-18;y+=12) for(let x=((y/12)&1)*6;x<w;x+=12){
    px(x, y, motif); px(x-1, y+1, motif); px(x+1, y+1, motif); px(x, y+2, motif); px(x, y+1, P32('#f0cdd4'));
  }
  const rail = wallB - 18;
  rect(0, rail, w, 2, P32('#d4b06a'));
  rect(0, rail+2, w, 16, P32('#fbf6f2'));
  for(let x=3;x<w-3;x+=16){ rect(x, rail+5, 12, 1, P32('#e6d8d4')); rect(x, rail+15, 12, 1, P32('#e6d8d4')); rect(x, rail+5, 1, 11, P32('#e6d8d4')); rect(x+11, rail+5, 1, 11, P32('#e6d8d4')); }
  rect(0, wallB-1, w, 1, P32('#cbb7b2'));
  rect(0, 0, w, 3, P32('#fbf6f2')); rect(0, 3, w, 1, P32('#d4b06a'));

  /* 꽃벽 포토존 */
  const fw = Math.min(56, Math.round(w*0.27)), fx0 = cx - fw, fx1 = cx + fw;
  const fTop = Math.round(h*0.09), fBot = wallB - 4;
  const ROSE = ['#ffffff','#fde7ec','#f7c5cf','#f3b8c6','#f6caa0','#fbe3a6'].map(P32);
  const RSH = ['#e9d9dc','#ecc3cc','#e2a2b1'].map(P32);
  const G = ['#5d8a5a','#7aa56d','#3f6b45'].map(P32);
  for(let y=fTop;y<fBot;y++) for(let x=fx0;x<=fx1;x++){
    const dx = (x - cx) / fw, top = fTop + (1 - Math.sqrt(Math.max(0, 1 - dx*dx))) * (fBot - fTop) * 0.35;
    if(y >= top) px(x, y, G[(rnd()*3)|0]);
  }
  for(let i=0;i<Math.round(fw*(fBot-fTop)/1.3);i++){
    const x = fx0 + rnd()*(fx1-fx0), y = fTop + rnd()*(fBot-fTop);
    const dx = (x - cx) / fw, top = fTop + (1 - Math.sqrt(Math.max(0, 1 - dx*dx))) * (fBot - fTop) * 0.35;
    if(y < top + 1) continue;
    const c = (rnd()*ROSE.length)|0;
    disc(x, y, 1, RSH[c % 3]); px(x-0.5, y-0.5, ROSE[c]); px(x+0.5, y-0.5, ROSE[c]); px(x, y, ROSE[c]);
  }

  /* 흰 소파 */
  const sy = wallB - 12, sw = Math.min(30, Math.round(w*0.15));
  for(let i=-sw;i<=sw;i++){
    const t = Math.round(3 - 3*Math.cos(i/sw*Math.PI/2*0.9));
    rect(cx+i, sy - 10 + t, 1, 12 - t, P32('#fbf8f4'));
    px(cx+i, sy - 10 + t, P32('#e7dfd6'));
  }
  for(let i=-sw+4;i<=sw-4;i+=5) for(let j=0;j<2;j++) px(cx+i+(j*2), sy-6+j*3, P32('#e2d8cd'));
  rect(cx-sw, sy+2, sw*2+1, 5, P32('#f4efe8')); rect(cx-sw, sy+6, sw*2+1, 1, P32('#ddd3c7'));
  rect(cx-sw-3, sy-4, 4, 11, P32('#fbf8f4')); rect(cx+sw, sy-4, 4, 11, P32('#fbf8f4'));
  rect(cx-sw-3, sy-4, 4, 1, P32('#e7dfd6')); rect(cx+sw, sy-4, 4, 1, P32('#e7dfd6'));
  rect(cx-sw-2, sy+7, 2, 3, P32('#d4b06a')); rect(cx+sw+1, sy+7, 2, 3, P32('#d4b06a'));
  rect(cx-6, sy-2, 4, 4, P32('#f3b8c6')); rect(cx+3, sy-2, 4, 4, P32('#f6caa0'));

  /* 러그 */
  ell(cx, wallB + 18, Math.min(52, Math.round(w*0.26)), 10, P32('#d695a3'));
  ell(cx, wallB + 18, Math.min(49, Math.round(w*0.245)), 8, P32('#ecc3cc'));
  ell(cx, wallB + 18, Math.min(30, Math.round(w*0.15)), 4, P32('#f7d9df'));

  /* 왼쪽: 금테 거울 */
  const mx0 = Math.max(6, Math.round(w*0.04)), mw = 16, my0 = Math.round(h*0.06), mh = rail - my0 - 2;
  if(fx0 - mx0 > mw + 4){
    rect(mx0-2, my0-2, mw+4, mh+4, P32('#d4b06a'));
    rect(mx0-1, my0-1, mw+2, mh+2, P32('#a8823e'));
    for(let y=0;y<mh;y++) for(let i=0;i<mw;i++) px(mx0+i, my0+y, mix('#e8f0f5', '#c9d8e2', y/mh));
    for(let k=0;k<mh;k+=1){ px(mx0+3+Math.round(k*0.35), my0+k, P32('#ffffff')); if(k%2) px(mx0+5+Math.round(k*0.35), my0+k, P32('#f4f8fb')); }
    rect(mx0+Math.round(mw/2)-3, my0-5, 7, 3, P32('#d4b06a')); px(mx0+Math.round(mw/2), my0-6, P32('#f3b8c6'));
  }

  /* 오른쪽: 드레스 */
  const dx = Math.min(w - 14, Math.round(w*0.89)), dTop = Math.round(h*0.15);
  if(dx - fx1 > 12){
    rect(dx, dTop, 1, 4, P32('#a8823e')); disc(dx, dTop-1, 1, P32('#d4b06a'));
    rect(dx-3, dTop+4, 7, 8, P32('#ffffff')); rect(dx-3, dTop+4, 7, 1, P32('#f0e8e4'));
    rect(dx-2, dTop+12, 5, 2, P32('#f3b8c6'));
    const skirtH = rail - dTop - 14;
    for(let j=0;j<skirtH;j++){
      const half = Math.min(9, 2 + Math.round(j * 0.3));
      for(let i=-half;i<=half;i++) px(dx+i, dTop+14+j, ((i+j)%5===0) ? P32('#efe7e9') : P32('#ffffff'));
      px(dx-half-1, dTop+14+j, P32('#e3d8da')); px(dx+half+1, dTop+14+j, P32('#e3d8da'));
    }
    rect(dx-1, dTop+14+skirtH, 3, 4, P32('#d4b06a'));
    rect(dx-5, dTop+18+skirtH, 11, 1, P32('#a8823e'));
  }

  /* 화병 받침 */
  [fx0 - 7, fx1 + 7].forEach(vx => {
    if(vx < 6 || vx > w - 6) return;
    rect(vx-3, wallB-14, 7, 14, P32('#fbf6f2')); rect(vx-3, wallB-14, 7, 1, P32('#d4b06a'));
    rect(vx-2, wallB-19, 5, 5, P32('#dfe9f0'));
    for(let k=0;k<10;k++){ const c = ROSE[(rnd()*ROSE.length)|0]; px(vx-3+rnd()*7, wallB-25+rnd()*7, c); }
    for(let k=0;k<6;k++) px(vx-3+rnd()*7, wallB-21+rnd()*4, G[(rnd()*3)|0]);
  });

  /* 작은 샹들리에 */
  const gold = P32('#d4b06a');
  for(let y=4;y<Math.round(h*0.05);y++) if(y%2===0) px(cx, y, gold);
  const ct = Math.round(h*0.05);
  rect(cx-7, ct, 15, 1, gold);
  for(let i=-7;i<=7;i+=2){ px(cx+i, ct+1, P32('#ffffff')); px(cx+i, ct+2, P32('#dfe8f8')); }
  rect(cx-4, ct+3, 9, 1, gold);
  [-7,-3,0,3,7].forEach(i => { px(cx+i, ct-1, P32('#fff4d6')); bulbs.push({ x:cx+i, y:ct-1, ph:rnd()*6.28, small:1 }); });

  return { key:'bridal', name:'신부대기실', bg: toCanvas(), bulbs, stars, minY: wallB + 12, minX: 8, maxX: w - 8, light:1 };
}
/*==WORLD_END==*/

/* =========================================================
   3) 세 개의 방, 화면 크기 맞추기, 그리기 루프
   왼쪽 연회장 | 가운데 예식홀 | 오른쪽 신부대기실
========================================================= */
const sceneEl = document.getElementById('scene');
const cvs = document.getElementById('world');
const ctx = cvs.getContext('2d');
const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPEED = REDUCE ? 0.4 : 1;
const ROOM_NAMES = ['연회장', '예식홀', '신부대기실'];
const ROOM_WEIGHTS = [0.35, 0.45, 0.20];   // 하객이 처음 놓이는 비율
let rooms = [];
let cssW = 0, cssH = 0;
let curRoom = 1;                 // 지금 보고 있는 방
let camX = 0;                    // 카메라 위치 (도트 단위)

function layout(){
  cssW = sceneEl.clientWidth; cssH = sceneEl.clientHeight;
  if(cssW < 50 || cssH < 50) return;
  dprNow = Math.min(window.devicePixelRatio || 1, 3);
  cvs.width = Math.round(cssW * dprNow);
  cvs.height = Math.round(cssH * dprNow);
  P = Math.max(2, Math.round(Math.min(cvs.width / 230, cvs.height / 400)));
  AW = Math.ceil(cvs.width / P);
  AH = Math.ceil(cvs.height / P);
  const ceremonyBg = buildWorld();
  rooms = [
    buildBanquet(),
    { key:'ceremony', name:'예식홀', bg: ceremonyBg, bulbs: world.bulbs, stars: world.stars,
      minY: world.archBaseY + 12, minX: world.sideW + 8, maxX: AW - world.sideW - 8 },
    buildBridal()
  ];
  camX = curRoom * AW;
  placeCouple();
  guests.forEach(g => clampToRoom(g));
  while(pending.length){ const p = pending.shift(); addGuest(p[0], p[1]); }
  updateNav();
}

const guests = new Map();   // 하객 id -> 상태
const npcs = [];            // 신부, 신랑
const pending = [];

function placeCouple(){
  const brideLook = { s:SKINS[1], h:HAIRS[1], t:'#fdfdfd', hs:2, o:2, g:0, v:1 };
  const groomLook = { s:SKINS[2], h:HAIRS[0], t:'#1f1f2e', hs:1, o:1, g:0, v:0 };
  npcs.length = 0;
  npcs.push({ id:'bride', room:1, name:BRIDE_NAME, look:brideLook, x: world.cx - 14, y: world.archBaseY + 2, message:'와줘서 정말 고마워요!', npc:true, frame:0, face:1 });
  npcs.push({ id:'groom', room:1, name:GROOM_NAME, look:groomLook, x: world.cx + 14, y: world.archBaseY + 2, message:'함께해줘서 고마워요 :)', npc:true, frame:0, face:-1 });
}

function roomBounds(r){
  const R = rooms[r];
  return { minX: R.minX, maxX: Math.max(R.minX + 30, R.maxX), minY: R.minY, maxY: Math.max(R.minY + 20, AH - 6) };
}
function clampToRoom(g){
  const b = roomBounds(g.room);
  g.x = Math.min(Math.max(g.x, b.minX), b.maxX);
  g.y = Math.min(Math.max(g.y, b.minY), b.maxY);
}
function hashStr(s){
  let h = 2166136261;
  for(const ch of String(s)){ h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); }
  h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function pickRoom(id){
  const u = hashStr(id);
  return u < ROOM_WEIGHTS[0] ? 0 : (u < ROOM_WEIGHTS[0] + ROOM_WEIGHTS[1] ? 1 : 2);
}

function addGuest(id, data){
  if(guests.has(id)) return;
  if(!AW){ pending.push([id, data]); return; }
  const room = pickRoom(id);
  const b = roomBounds(room);
  const ang = Math.random() * Math.PI * 2, sp = (8 + Math.random()*10) * SPEED;
  guests.set(id, {
    id, room, name: data.name || '이름없음', message: data.message || '', look: cleanLook(data.look),
    side: cleanLook(data.look).side,
    x: b.minX + Math.random()*(b.maxX-b.minX), y: b.minY + Math.random()*(b.maxY-b.minY),
    vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp*0.6, face: 1, frame: 0, stepT: 0, travel: 0,
    nextTurn: performance.now() + 800 + Math.random()*2500
  });
  updateCount();
  if(id === focusId) focusGuest(id);
}

function removeGuest(id){
  guests.delete(id);
  const bb = bubbles.get(id); if(bb){ bb.el.remove(); bubbles.delete(id); }
  updateCount();
}

function roomCounts(){
  const c = [0, 0, 0];
  guests.forEach(g => c[g.room]++);
  return c;
}
let countTimer = 0;
function updateCount(){
  document.getElementById('guestCount').textContent = '하객 ' + guests.size + '명';
  document.getElementById('emptyState').hidden = guests.size > 0 || curRoom !== 1;
  updateNav();
}

/* 걷기: 가끔 옆 방으로 넘어감 */
function stepGuests(dt, now){
  guests.forEach(g => {
    const b = roomBounds(g.room);
    if(g.travel){
      g.x += g.vx*dt; g.y += g.vy*dt;
      if(g.y < b.minY){ g.y = b.minY; g.vy = Math.abs(g.vy); }
      if(g.y > b.maxY){ g.y = b.maxY; g.vy = -Math.abs(g.vy); }
      if(g.x < -8 || g.x > AW + 8){
        g.room += g.travel;
        const nb = roomBounds(g.room);
        g.x = g.travel > 0 ? -6 : AW + 6;
        g.y = Math.min(Math.max(g.y, nb.minY), nb.maxY);
        g.entering = g.travel; g.travel = 0;
        g.nextTurn = now + 1500 + Math.random()*1500;
        updateCount();
      }
    } else {
      if(now > g.nextTurn){
        const r = Math.random();
        if(r < 0.025 && !REDUCE){
          const dir = g.room === 0 ? 1 : g.room === 2 ? -1 : (Math.random() < 0.5 ? -1 : 1);
          g.travel = dir; g.vx = dir * (14 + Math.random()*6) * SPEED; g.vy = (Math.random()-0.5) * 4;
        } else if(r < 0.32){ g.vx = 0; g.vy = 0; g.nextTurn = now + 1200 + Math.random()*2200; }
        else {
          const sp = (8 + Math.random()*10) * SPEED, a = Math.random()*Math.PI*2;
          g.vx = Math.cos(a)*sp; g.vy = Math.sin(a)*sp*0.6; g.nextTurn = now + 2200 + Math.random()*3200;
        }
      }
      g.x += g.vx*dt; g.y += g.vy*dt;
      if(g.entering){
        if(g.x >= b.minX && g.x <= b.maxX) g.entering = 0;
      } else {
        if(g.x < b.minX){ g.x = b.minX; g.vx = Math.abs(g.vx); }
        if(g.x > b.maxX){ g.x = b.maxX; g.vx = -Math.abs(g.vx); }
      }
      if(g.y < b.minY){ g.y = b.minY; g.vy = Math.abs(g.vy); }
      if(g.y > b.maxY){ g.y = b.maxY; g.vy = -Math.abs(g.vy); }
    }
    if(g.vx !== 0 || g.vy !== 0){ g.stepT += dt; if(g.stepT > 0.24){ g.stepT = 0; g.frame ^= 1; } } else { g.frame = 0; }
    if(g.vx < -0.5) g.face = -1; else if(g.vx > 0.5) g.face = 1;
  });
}

/* 카메라: 목표 방으로 부드럽게 이동 */
function stepCamera(dt){
  const target = curRoom * AW + dragOff;
  if(REDUCE || dragging){ camX = target; return; }
  const k = 1 - Math.pow(0.0008, dt);
  camX += (target - camX) * k;
  if(Math.abs(target - camX) < 0.05) camX = target;
}

function screenX(r, x){ return r*AW + x - camX; }

function drawFrame(tms){
  if(!rooms.length) return;
  const t = tms / 1000;
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#0d0b13';
  ctx.fillRect(0, 0, cvs.width, cvs.height);

  rooms.forEach((R, r) => {
    const ox = r*AW - camX;
    if(ox <= -AW || ox >= AW) return;
    const dx = Math.round(ox * P);
    ctx.drawImage(R.bg, 0, 0, AW, AH, dx, 0, AW*P, AH*P);
    R.bulbs.forEach(bl => {
      const a = REDUCE ? 0.16 : 0.10 + 0.10*Math.sin(t*2.4 + bl.ph);
      const rr = bl.small ? 1 : 2;
      ctx.fillStyle = 'rgba(255,214,140,' + a.toFixed(3) + ')';
      ctx.fillRect(dx + (bl.x-rr)*P, (bl.y-rr)*P, (2*rr+1)*P, (2*rr+1)*P);
      ctx.fillStyle = 'rgba(255,242,200,.95)';
      ctx.fillRect(dx + bl.x*P, bl.y*P, P, P);
    });
    R.stars.forEach(st => {
      const v = REDUCE ? 0.6 : 0.5 + 0.5*Math.sin(t*st.sp + st.ph);
      if(v < 0.55) return;
      const a = (v - 0.55) / 0.45 * (st.dim ? 0.55 : 1);
      ctx.fillStyle = 'rgba(235,242,255,' + a.toFixed(3) + ')';
      ctx.fillRect(dx + st.x*P, st.y*P, P, P);
      if(!st.dim && v > 0.9){
        ctx.fillStyle = 'rgba(170,195,255,' + (a*0.7).toFixed(3) + ')';
        ctx.fillRect(dx + (st.x-1)*P, st.y*P, P, P); ctx.fillRect(dx + (st.x+1)*P, st.y*P, P, P);
        ctx.fillRect(dx + st.x*P, (st.y-1)*P, P, P); ctx.fillRect(dx + st.x*P, (st.y+1)*P, P, P);
      }
    });
  });

  /* 화면에 보이는 사람들만 (아래쪽일수록 앞) */
  const vis = [];
  const push = e => { const sx = screenX(e.room, e.x); if(sx > -16 && sx < AW + 16) vis.push([sx, e]); };
  npcs.forEach(push); guests.forEach(push);
  vis.sort((a, b) => a[1].y - b[1].y);

  vis.forEach(([sx, e]) => {
    const fx = Math.round(sx), fy = Math.round(e.y);
    ctx.fillStyle = 'rgba(8,16,12,.38)';
    ctx.fillRect((fx-4)*P, (fy-2)*P, 8*P, P);
    ctx.fillRect((fx-6)*P, (fy-1)*P, 12*P, 2*P);
    ctx.fillRect((fx-4)*P, (fy+1)*P, 8*P, P);
    const bob = (e.frame === 1) ? 1 : 0;
    const spr = getSprite(e.look, e.frame, e.face < 0);
    ctx.drawImage(spr, 0, 0, SW, SH, (fx - 11) * P, (fy - FEET - bob) * P, SW*P, SH*P);
    if(e.id === focusId && performance.now() < focusUntil){
      const a = 0.5 + 0.5*Math.sin(performance.now()/180);
      ctx.fillStyle = 'rgba(255,224,138,' + a.toFixed(3) + ')';
      ctx.fillRect((fx-1)*P, (fy - FEET - 6)*P, 3*P, 2*P);
      ctx.fillRect(fx*P, (fy - FEET - 4)*P, P, P);
    }
  });
  const nameSize = Math.round(12 * dprNow);
  ctx.font = nameSize + 'px Jua, "Gowun Dodum", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  /* 이름표: 겹치면 앞쪽 하객 것만 (신랑·신부와 내 미니미는 항상) */
  const placed = [];
  const lh = nameSize + 4 * dprNow;
  const order = vis.slice().sort((a, b) => {
    const pa = (a[1].npc || a[1].id === focusId) ? 1 : 0, pb = (b[1].npc || b[1].id === focusId) ? 1 : 0;
    return (pb - pa) || (b[1].y - a[1].y);
  });
  order.forEach(([sx, e]) => {
    const fx = Math.round(sx), fy = Math.round(e.y);
    if(e._lwSize !== nameSize){ e._lw = ctx.measureText(e.name).width + 6 * dprNow; e._lwSize = nameSize; }
    const cxp = fx*P, top = fy*P + 14*dprNow - nameSize;
    const box = [cxp - e._lw/2, top, cxp + e._lw/2, top + lh];
    const must = e.npc || e.id === focusId;
    if(!must && placed.some(q => box[0] < q[2] && box[2] > q[0] && box[1] < q[3] && box[3] > q[1])) return;
    placed.push(box);
    ctx.lineWidth = 3 * dprNow;
    ctx.strokeStyle = 'rgba(20,12,30,.92)';
    ctx.strokeText(e.name, cxp, fy*P + 14*dprNow);
    ctx.fillStyle = must ? '#ffe08a' : '#ffffff';
    ctx.fillText(e.name, cxp, fy*P + 14*dprNow);
  });
}

let lastT = performance.now();
function loop(tms){
  const dt = Math.min(0.05, (tms - lastT) / 1000);
  lastT = tms;
  stepGuests(dt, tms);
  stepCamera(dt);
  drawFrame(tms);
  updateBubbles(tms);
  requestAnimationFrame(loop);
}

/* =========================================================
   3-1) 방 이동: 스와이프, 화살표, 방 이름 버튼, 키보드
========================================================= */
const navBtns = Array.from(document.querySelectorAll('#roomNav button'));
const goLeft = document.getElementById('goLeft');
const goRight = document.getElementById('goRight');

function goRoom(r){
  r = Math.max(0, Math.min(2, r));
  if(r === curRoom) return;
  curRoom = r;
  bubbles.forEach(b => b.el.remove()); bubbles.clear();
  updateCount();
}
function updateNav(){
  const c = roomCounts();
  navBtns.forEach((b, i) => {
    b.classList.toggle('on', i === curRoom);
    b.setAttribute('aria-pressed', i === curRoom ? 'true' : 'false');
    b.querySelector('b').textContent = c[i];
  });
  goLeft.hidden = curRoom === 0;
  goRight.hidden = curRoom === 2;
  if(curRoom > 0) goLeft.querySelector('span').textContent = ROOM_NAMES[curRoom - 1];
  if(curRoom < 2) goRight.querySelector('span').textContent = ROOM_NAMES[curRoom + 1];
}
navBtns.forEach((b, i) => b.addEventListener('click', () => goRoom(i)));
goLeft.addEventListener('click', () => goRoom(curRoom - 1));
goRight.addEventListener('click', () => goRoom(curRoom + 1));
document.addEventListener('keydown', e => {
  if(modalOverlay.classList.contains('open')) return;
  if(e.key === 'ArrowLeft') goRoom(curRoom - 1);
  else if(e.key === 'ArrowRight') goRoom(curRoom + 1);
});

let dragging = false, dragOff = 0, downX = 0, downY = 0, downId = null, swiped = false;
cvs.addEventListener('pointerdown', e => {
  downId = e.pointerId; downX = e.clientX; downY = e.clientY; swiped = false; dragging = false; dragOff = 0;
});
cvs.addEventListener('pointermove', e => {
  if(e.pointerId !== downId) return;
  const dx = e.clientX - downX, dy = e.clientY - downY;
  if(!dragging && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.3){ dragging = true; try{ cvs.setPointerCapture(e.pointerId); }catch(_){} }
  if(dragging){
    let off = -dx * dprNow / P;
    if((curRoom === 0 && off < 0) || (curRoom === 2 && off > 0)) off *= 0.25;
    dragOff = off;
  }
});
function endDrag(e){
  if(e.pointerId !== downId) return;
  downId = null;
  if(dragging){
    const dx = e.clientX - downX;
    swiped = true;
    dragging = false;
    if(dx < -50) goRoom(curRoom + 1); else if(dx > 50) goRoom(curRoom - 1);
    dragOff = 0;
  }
}
cvs.addEventListener('pointerup', endDrag);
cvs.addEventListener('pointercancel', endDrag);

/* =========================================================
   4) 말풍선
========================================================= */
const bubbleLayer = document.getElementById('bubbles');
const bubbles = new Map();
function entityById(id){ return guests.get(id) || npcs.find(n => n.id === id); }
function showBubble(id, text, ms){
  let b = bubbles.get(id);
  if(!b){
    const el = document.createElement('div'); el.className = 'bubble';
    bubbleLayer.appendChild(el); b = { el, until: 0 }; bubbles.set(id, b);
  }
  const e = entityById(id);
  const side = e && e.side;
  b.el.className = 'bubble' + (side ? ' ' + side : (e && e.npc ? ' couple' : ''));
  b.el.textContent = '';
  if(side){
    const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = SIDES[side];
    b.el.appendChild(tag);
  }
  b.el.appendChild(document.createTextNode(text));
  b.until = performance.now() + ms;
}
function updateBubbles(now){
  bubbles.forEach((b, id) => {
    const e = entityById(id);
    if(!e || now > b.until){ b.el.remove(); bubbles.delete(id); return; }
    const sx = screenX(e.room, e.x);
    if(sx < -10 || sx > AW + 10){ b.el.style.visibility = 'hidden'; return; }
    b.el.style.visibility = '';
    const cx = sx * P / dprNow, cyy = (e.y - FEET - 3) * P / dprNow;
    const half = b.el.offsetWidth / 2;
    const x = Math.min(Math.max(cx, half + 8), cssW - half - 8);
    b.el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + cyy.toFixed(1) + 'px) translate(-50%,-100%) translateY(-6px)';
    b.el.style.setProperty('--tx', (cx - x).toFixed(1) + 'px');
  });
}
cvs.addEventListener('click', ev => {
  if(swiped){ swiped = false; return; }
  const r = cvs.getBoundingClientRect();
  const ax = (ev.clientX - r.left) * dprNow / P, ay = (ev.clientY - r.top) * dprNow / P;
  const list = [];
  npcs.forEach(e => list.push(e)); guests.forEach(e => list.push(e));
  list.sort((a, b) => b.y - a.y);
  for(const e of list){
    const sx = screenX(e.room, e.x);
    if(Math.abs(ax - sx) <= 9 && ay >= e.y - FEET && ay <= e.y + 2){
      showBubble(e.id, e.message || '결혼 축하해요!', 3600);
      return;
    }
  }
});
setInterval(() => {
  if(bubbles.size >= 3 || dragging) return;
  const here = [];
  guests.forEach(g => { if(g.room === curRoom && g.message && !g.travel && !bubbles.has(g.id)) here.push(g); });
  if(!here.length) return;
  const g = here[Math.floor(Math.random() * here.length)];
  showBubble(g.id, g.message, 5000);
}, 2300);

/* 내가 만든 미니미 찾아가기 */
let focusId = null, focusUntil = 0;
function focusGuest(id){
  const g = guests.get(id);
  if(!g) return;
  focusUntil = performance.now() + 8000;
  if(g.room !== curRoom) goRoom(g.room);
  const b = roomBounds(g.room);
  g.x = (b.minX + b.maxX) / 2 + (Math.random() - 0.5) * 30;
  g.y = b.minY + (b.maxY - b.minY) * 0.35;
  g.vx = 0; g.vy = 0; g.travel = 0; g.entering = 0;
  g.nextTurn = performance.now() + 4000;
  showBubble(id, g.message || '입장했어요!', 5000);
}

/* =========================================================
   5) 하객 데이터 (Firestore 실시간, 설정 전에는 체험 하객)
========================================================= */
function startData(){
  if(firebaseReady){
    db.collection('guests').orderBy('createdAt','asc').onSnapshot(snap => {
      snap.docChanges().forEach(ch => {
        if(ch.type === 'added') addGuest(ch.doc.id, ch.doc.data());
        else if(ch.type === 'removed') removeGuest(ch.doc.id);
      });
    }, err => {
      console.error(err);
      showBanner("방명록을 불러오지 못했어요. Firestore 보안 규칙을 확인해주세요.");

      ['체험 하객 4','오늘 정말 예뻐요!'], ['체험 하객 5',''], ['체험 하객 6','두 분 영원히!'],
      ['체험 하객 7','케이크 맛있어요'], ['체험 하객 8',''], ['체험 하객 9','신부님 최고!'],
      ['체험 하객 10','축하합니다'], ['체험 하객 11',''], ['체험 하객 12','오래오래 행복하세요']
    ];
    demo.forEach((d, i) => addGuest('demo' + i, { name:d[0], message:d[1], look:randomLook(rnd) }));

/* =========================================================
   6) 사진 찍기, 색 뽑기, 꾸미기
========================================================= */
const joinBtn = document.getElementById('joinBtn');
const modalOverlay = document.getElementById('modalOverlay');
const stepCam = document.getElementById('stepCam');
const stepLook = document.getElementById('stepLook');
const camWrap = document.getElementById('camWrap');
const video = document.getElementById('video');
const captureBtn = document.getElementById('captureBtn');
const camError = document.getElementById('camError');
const pickLabel = document.getElementById('pickLabel');
const fileInput = document.getElementById('fileInput');
const previewCanvas = document.getElementById('previewCanvas');
const nameInput = document.getElementById('nameInput');
const msgInput = document.getElementById('msgInput');
const saveError = document.getElementById('saveError');
const submitBtn = document.getElementById('submitBtn');
let guestSide = '';

let stream = null;
let look = defaultLook();

function setCameraAvailable(ok){
  camWrap.hidden = !ok; captureBtn.hidden = !ok;
  pickLabel.classList.toggle('primary', !ok);
}
async function startCamera(){
  camError.style.display = 'none';
  setCameraAvailable(true);
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('camera-unsupported');
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' }, audio:false });
    video.srcObject = stream;
  }catch(e){
    console.error(e);
    setCameraAvailable(false);
    camError.style.display = 'block';
    camError.textContent = '카메라를 사용할 수 없어요. 아래에서 앨범 사진을 고르거나 직접 꾸며주세요.';
  }
}
function stopCamera(){ if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } }

function nearest(palette, rgb){
  let best = palette[0], bd = 1e9;
  palette.forEach(h => {
    const c = hex2rgb(h);
    const d = (c[0]-rgb[0])**2 + (c[1]-rgb[1])**2 + (c[2]-rgb[2])**2;
    if(d < bd){ bd = d; best = h; }
  });
  return best;
}
function lookFromSource(source, sw, sh){
  const N = 64;
  const c = document.createElement('canvas'); c.width = N; c.height = N;
  const x = c.getContext('2d', { willReadFrequently:true });
  const s = Math.min(sw, sh);
  x.drawImage(source, (sw-s)/2, (sh-s)/2, s, s, 0, 0, N, N);
  const avg = (x0,y0,x1,y1) => {
    const d = x.getImageData(x0,y0,x1-x0,y1-y0).data;
    let r=0,g=0,b=0; const n = d.length/4;
    for(let i=0;i<d.length;i+=4){ r+=d[i]; g+=d[i+1]; b+=d[i+2]; }
    return [r/n, g/n, b/n];
  };
  const l = defaultLook();
  l.s = nearest(SKINS, avg(27,26,37,38));
  l.h = nearest(HAIRS, avg(27,12,37,17));
  l.t = nearest(TOPS, avg(18,56,46,64));
  return l;
}

function makeChips(el, labels, key){
  el.innerHTML = '';
  labels.forEach((t, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = t; b.dataset.i = i;
    b.addEventListener('click', () => { look[key] = i; renderLook(); });
    el.appendChild(b);
  });
}
function makeSwatches(el, colors, key){
  el.innerHTML = '';
  colors.forEach(col => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sw'; b.dataset.c = col;
    if(col){ b.style.background = col; b.setAttribute('aria-label', col); }
    else { b.classList.add('auto'); b.textContent = '자동'; b.setAttribute('aria-label', '옷에 맞춰 자동'); }
    b.addEventListener('click', () => { look[key] = col; renderLook(); });
    el.appendChild(b);
  });
}
function markOn(el, test){ Array.from(el.children).forEach(b => b.classList.toggle('on', test(b))); }
function renderLook(){
  const g = previewCanvas.getContext('2d');
  g.clearRect(0, 0, SW, SH);
  g.drawImage(getSprite(look, 0, false), 0, 0);
  markOn(document.getElementById('hsRow'), b => +b.dataset.i === look.hs);
  markOn(document.getElementById('outfitRow'), b => +b.dataset.i === look.o);
  markOn(document.getElementById('hairRow'), b => b.dataset.c === look.h);
  markOn(document.getElementById('skinRow'), b => b.dataset.c === look.s);
  markOn(document.getElementById('topRow'), b => b.dataset.c === look.t);
  markOn(document.getElementById('pantsRow'), b => b.dataset.c === (look.p || ''));
  markOn(document.getElementById('accRow'), b => +b.dataset.i === look.a);
  document.getElementById('pantsGrp').hidden = NO_PANTS.includes(look.o);
  document.querySelectorAll('#sideRow .sideBtn').forEach(b => {
    const on = b.dataset.side === guestSide;
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}
makeChips(document.getElementById('hsRow'), HAIR_STYLES, 'hs');
makeChips(document.getElementById('outfitRow'), OUTFITS, 'o');
makeSwatches(document.getElementById('hairRow'), HAIRS, 'h');
makeSwatches(document.getElementById('skinRow'), SKINS, 's');
makeSwatches(document.getElementById('topRow'), TOPS, 't');
makeSwatches(document.getElementById('pantsRow'), [''].concat(PANTS), 'p');
makeChips(document.getElementById('accRow'), ACCS, 'a');
document.getElementById('sideGroomName').textContent = GROOM_NAME;
document.getElementById('sideBrideName').textContent = BRIDE_NAME;
document.querySelectorAll('#sideRow .sideBtn').forEach(b => b.addEventListener('click', () => {
  guestSide = b.dataset.side;
  if(saveError.dataset.kind === 'side') saveError.hidden = true;
  renderLook();
}));

function gotoLook(l){
  look = l;
  saveError.hidden = true;
  stepCam.classList.remove('active');
  stepLook.classList.add('active');
  stopCamera();
  renderLook();
}
function backToPicker(){
  stepLook.classList.remove('active');
  stepCam.classList.add('active');
  startCamera();
}

joinBtn.addEventListener('click', () => {
  modalOverlay.classList.add('open');
  stepCam.classList.add('active'); stepLook.classList.remove('active');
  nameInput.value = ''; msgInput.value = '';
  guestSide = '';
  startCamera();
});
function closeModalFn(){ modalOverlay.classList.remove('open'); stopCamera(); }
document.getElementById('closeModal').addEventListener('click', closeModalFn);
modalOverlay.addEventListener('click', e => { if(e.target === modalOverlay) closeModalFn(); });
document.getElementById('backBtn').addEventListener('click', backToPicker);

captureBtn.addEventListener('click', () => {
  if(!video.videoWidth) return;
  gotoLook(lookFromSource(video, video.videoWidth, video.videoHeight));
});
fileInput.addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => { const l = lookFromSource(img, img.naturalWidth, img.naturalHeight); URL.revokeObjectURL(url); fileInput.value = ''; gotoLook(l); };
  img.onerror = () => {
    URL.revokeObjectURL(url); fileInput.value = '';
    camError.style.display = 'block';
    camError.textContent = '이 사진은 열 수 없어요. JPG나 PNG 사진으로 다시 골라주세요.';
  };
  img.src = url;
});
document.getElementById('diyBtn').addEventListener('click', () => gotoLook(randomLook(Math.random)));

submitBtn.addEventListener('click', async () => {
  const name = nameInput.value.trim();
  if(!guestSide){
    saveError.dataset.kind = 'side';
    saveError.textContent = '신랑 측인지 신부 측인지 골라주세요.';
    saveError.hidden = false;
    document.getElementById('sideRow').scrollIntoView({ block:'center', behavior: REDUCE ? 'auto' : 'smooth' });
    return;
  }
  if(!name){ nameInput.focus(); return; }
  saveError.dataset.kind = '';
  submitBtn.disabled = true;
  submitBtn.textContent = '입장하는 중...';
  const payload = {
    name: name.slice(0, 12),
    message: msgInput.value.trim().slice(0, 60),
    look: cleanLook(Object.assign({}, look, { side: guestSide })),
    createdAt: firebaseReady ? firebase.firestore.FieldValue.serverTimestamp() : Date.now()
  };
  try{
    if(firebaseReady){
      const ref = await db.collection('guests').add(payload);
      focusId = ref.id;
      closeModalFn();
      focusGuest(ref.id);
    } else {
      const id = 'local-' + Date.now();
      focusId = id;
      closeModalFn();
      addGuest(id, payload);
    }
  }catch(e){
    console.error(e);
    saveError.hidden = false;
    saveError.textContent = '저장에 실패했어요. 잠시 후 다시 눌러주세요.';
  }finally{
    submitBtn.disabled = false;
    submitBtn.textContent = '식장에 입장하기';
  }
});

/* =========================================================
   7) 시작
========================================================= */
document.getElementById('couple').innerHTML = GROOM_EN + ' <span class="heart">♥</span> ' + BRIDE_EN;
if(window.ResizeObserver){ new ResizeObserver(() => { layout(); }).observe(sceneEl); }
else window.addEventListener('resize', layout);
layout();
startData();
updateCount();
if(document.fonts && document.fonts.load){ document.fonts.load('12px Jua'); }
requestAnimationFrame(loop);
</script>
